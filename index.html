<!DOCTYPE html>
<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMP TAQ </title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url("https://files.catbox.moe/4qe09s.jpg") center center/cover fixed;
color:#fff;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
backdrop-filter:blur(5px);
z-index:-1;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
margin-bottom:20px;
text-shadow:0 0 10px #000;
}

.title{
text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:25px;
}

.main{
display:flex;
justify-content:center;
margin-bottom:40px;
}

.main video{
width:340px;
height:600px;
border-radius:20px;
border:8px solid white;
background:#000;
object-fit:cover;
box-shadow:0 0 30px rgba(0,0,0,.6);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
padding:10px;
border-radius:18px;
}

.card video{
width:100%;
height:380px;
border-radius:15px;
object-fit:cover;
background:#000;
}

.footer{
text-align:center;
font-size:28px;
font-weight:bold;
padding:40px 0;
text-shadow:0 0 10px #000;
}

@media(max-width:600px){

.logo{
font-size:32px;
}

.title{
font-size:25px;
}

.main video{
width:90%;
height:520px;
}

.card video{
height:300px;
}

}
</style>

</head>
